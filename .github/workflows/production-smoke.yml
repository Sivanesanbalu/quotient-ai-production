name: QuotientAI Production Smoke
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: HTTPS URL of the approved QuotientAI deployment
        required: true
        default: https://quotient-ai-fullstack.vercel.app
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate target
        env:
          TARGET_URL: ${{ inputs.target_url || 'https://quotient-ai-fullstack.vercel.app' }}
        run: |
          node -e "const u=new URL(process.env.TARGET_URL); if(u.protocol!=='https:' || u.hostname!=='quotient-ai-fullstack.vercel.app')process.exit(1)"
      - name: Read-only production smoke check
        env:
          SMOKE_URL: ${{ inputs.target_url || 'https://quotient-ai-fullstack.vercel.app' }}
        run: node scripts/smoke.mjs
