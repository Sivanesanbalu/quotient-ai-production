name: QuotientAI Browser E2E
on:
  push:
    branches: [main]
    paths:
      - 'tests/browser-workflow.spec.mjs'
      - 'app/**'
      - 'lib/**'
      - 'schema.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quotient_e2e
          POSTGRES_PASSWORD: disposable_only
          POSTGRES_DB: quotient_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quotient_e2e -d quotient_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DISPOSABLE_DB: 'YES'
      DATABASE_URL: postgres://quotient_e2e:disposable_only@127.0.0.1:5432/quotient_e2e
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Install ephemeral browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Initialize disposable PostgreSQL
        run: PGPASSWORD=disposable_only psql -h 127.0.0.1 -U quotient_e2e -d quotient_e2e -v ON_ERROR_STOP=1 -f schema.sql
      - run: npm run build
      - name: Start local Next.js
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/quotient-browser.log 2>&1 &
      - name: Wait for local health
        run: |
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3100/api/health | grep -q '"database":"ready"'; then exit 0; fi
            sleep 2
          done
          cat /tmp/quotient-browser.log
          exit 1
      - name: Chromium browser workflow
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
        run: npx playwright test tests/browser-workflow.spec.mjs --browser chromium --workers 1 --reporter line
