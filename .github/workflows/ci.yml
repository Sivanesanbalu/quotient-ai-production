name: QuotientAI CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quotientai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source preflight
        run: npm run preflight
      - name: Static security checks
        run: npm run release:check
      - name: Node.js regression tests
        run: npm run test:source
  verify:
    needs: source-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-online
      - name: Report lockfile tracking status
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'Lockfile is committed to Git.'
          else
            echo '::warning::package-lock.json is generated in CI but not committed. Download the artifact and commit it to enable reproducible npm ci builds.'
          fi
      - name: Validate readiness lockfile guard
        run: |
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const lock = JSON.parse(readFileSync('package-lock.json', 'utf8')); if (lock.lockfileVersion !== 3 || !lock.packages?.[''] || Object.keys(lock.packages).length < 2) process.exit(1)"
      - name: Verify npm lockfile generation
        run: |
          test -s package-lock.json
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion<3 || !p.packages?.['']) process.exit(1)"
      - name: Preserve generated lockfile for reproducible commits
        uses: actions/upload-artifact@v4
        with:
          name: quotientai-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Source preflight
        run: npm run preflight
      - name: Security source checks
        run: npm run release:check
      - name: Unit and regression tests
        run: npm run test:source
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
