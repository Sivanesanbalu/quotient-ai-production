name: QuotientAI CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quotientai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source preflight
        run: npm run preflight
      - name: Static security checks
        run: npm run release:check
      - name: Node.js regression tests
        run: npm run test:source
  verify:
    needs: source-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Require committed dependency lockfile
        run: git ls-files --error-unmatch package-lock.json
      - name: Validate readiness lockfile guard
        run: |
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const lock = JSON.parse(readFileSync('package-lock.json', 'utf8')); if (lock.lockfileVersion !== 3 || !lock.packages?.[''] || Object.keys(lock.packages).length < 2) process.exit(1)"
      - name: Verify npm lockfile integrity
        run: |
          test -s package-lock.json
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion<3 || !p.packages?.['']) process.exit(1)"
      - name: Verify committed lockfile and dependency graph
        run: |
          git ls-files --error-unmatch package-lock.json
          npm ls --depth=0
      - name: Source preflight
        run: npm run preflight
      - name: Security source checks
        run: npm run release:check
      - name: Unit and regression tests
        run: npm run test:source
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  authenticated-e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quotient_e2e
          POSTGRES_PASSWORD: disposable_only
          POSTGRES_DB: quotient_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quotient_e2e -d quotient_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DISPOSABLE_DB: 'YES'
      E2E_BASE_URL: http://127.0.0.1:3100
      DATABASE_URL: postgres://quotient_e2e:disposable_only@127.0.0.1:5432/quotient_e2e
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Initialize disposable schema
        run: PGPASSWORD=disposable_only psql -h 127.0.0.1 -U quotient_e2e -d quotient_e2e -v ON_ERROR_STOP=1 -f schema.sql
      - name: Build application
        run: npm run build
      - name: Start application
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/quotient-e2e.log 2>&1 &
          echo $! > /tmp/quotient-e2e.pid
      - name: Wait for database health
        run: |
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3100/api/health | grep -q '"database":"ready"'; then exit 0; fi
            sleep 2
          done
          cat /tmp/quotient-e2e.log
          exit 1
      - name: Execute authenticated tenant-isolation E2E
        run: npm run test:e2e:local
